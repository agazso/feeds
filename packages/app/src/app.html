<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6200EA" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Feeds" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <script>
      // Early masonry detection - runs before first paint
      (function() {
        var needsJS = !CSS.supports('grid-template-rows', 'masonry');
        if (needsJS) {
          // Add class to hide masonry content until Colcade is ready
          document.documentElement.classList.add('js-masonry-loading');
          // Inject hiding CSS immediately
          var style = document.createElement('style');
          style.textContent = '.js-masonry-loading .post-list.three-column { opacity: 0; }';
          document.head.appendChild(style);
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
