<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Matches the .topbar background so the browser/status bar blends into the
         app header. Keep in step with --color-step-10 in app.css. -->
    <meta name="theme-color" content="#272727" />
    <!-- same-origin (not no-referrer): still leaks nothing to external sites, but
         sends a real Origin on same-origin form POSTs so SvelteKit CSRF/auth works. -->
    <meta name="referrer" content="same-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Feeds" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="%sveltekit.assets%/apple-touch-icon-167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="%sveltekit.assets%/apple-touch-icon-152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="%sveltekit.assets%/apple-touch-icon-120.png"
    />
    <script>
      // Early masonry detection - runs before first paint
      ;(function () {
        var needsJS = !CSS.supports('grid-template-rows', 'masonry')
        if (needsJS) {
          // Add class to hide masonry content until Colcade is ready
          document.documentElement.classList.add('js-masonry-loading')
          // Inject hiding CSS immediately
          var style = document.createElement('style')
          style.textContent = '.js-masonry-loading .post-list.three-column { opacity: 0; }'
          document.head.appendChild(style)
        }
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
